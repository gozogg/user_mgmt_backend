AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: User Managementi  backend - Lambda functions + API Gateway

# ============================================
# Parameters: values you'll be prompted for
# during `sam deploy --guided`, instead of
# hardcoding secrets in this file.
# ============================================
Parameters:
  DBHost:
    Type: String
  DBPort:
    Type: String
    Default: "5432"
  DBName:
    Type: String
    Default: "postgres"
  DBUser:
    Type: String
  DBPassword:
    Type: String
    NoEcho: true   # hides the value in console/CLI output
  MapBoxToken:
    Type: String
    NoEcho: true   # hides the value in console/CLI output
  VpcSecurityGroupId:
    Type: String
    Description: Security group ID that's allowed to reach RDS on port 5432
  SubnetId1:
    Type: String
    Description: First private subnet ID (same VPC as your RDS instance)
  SubnetId2:
    Type: String
    Description: Second private subnet ID (RDS/Lambda VPC config needs at least 2 for availability)
  JwtSecret:
    Type: String
    NoEcho: true
    Default: "67f2dac032db6036efe244ab0dd5a7ad7d87b501b5f5ab20fa915087ed590b63"
    Description: HMAC secret used to sign login JWTs. Override this in production.
  DemoUsername:
    Type: String
    Default: "demo"
  DemoPasswordHash:
    Type: String
    NoEcho: true
    Default: "89ca2d399f665cd1b21e29dc346496c0:06bdea0f53c03e9c599b626c44af95b3a5e33801bb5bfea449aa48c807580c18"
    Description: PBKDF2 hash from `python scripts/hash_password.py`. Default password is DemoJobs1!
  DemoOrgId:
    Type: String
    Default: "1"
  ClientUsername:
    Type: String
    Default: "client"
  ClientPasswordHash:
    Type: String
    NoEcho: true
    Default: "7b3ce0cc0f13b85c97e817f5310bb10c:4ae213c8df01d9d15e821990e3042235a9ffe62d95a934014af43e43c4df53cb"
    Description: PBKDF2 hash from `python scripts/hash_password.py`. Default password is ClientJobs1!
  ClientOrgId:
    Type: String
    Default: "2"

# ============================================
# Globals: shared settings applied to every
# function below, so you don't repeat yourself
# ============================================
Globals:
  Api:
    Auth:
      DefaultAuthorizer: JwtAuthorizer
      AddDefaultAuthorizerToCorsPreflight: false
      Authorizers:
        JwtAuthorizer:
          FunctionArn: !GetAtt AuthorizerFunction.Arn
          FunctionPayloadType: TOKEN
          Identity:
            Header: Authorization
            ReauthorizeEvery: 300
  Function:
    Runtime: python3.13
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        DB_HOST: !Ref DBHost
        DB_PORT: !Ref DBPort
        DB_NAME: !Ref DBName
        DB_USER: !Ref DBUser
        DB_PASSWORD: !Ref DBPassword
        MAPBOX_TOKEN: !Ref MapBoxToken

Resources:

  JobsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      Auth:
        DefaultAuthorizer: JwtAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          JwtAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            FunctionPayloadType: TOKEN
            Identity:
              Header: Authorization
              ReauthorizeEvery: 300
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
        UNAUTHORIZED:
          StatusCode: 401
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
          ResponseTemplates:
            application/json: '{"error":"unauthorized"}'

  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: auth.authorizer.lambda_handler
      Timeout: 5
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret

  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: auth.login.lambda_handler
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          DEMO_USERNAME: !Ref DemoUsername
          DEMO_PASSWORD_HASH: !Ref DemoPasswordHash
          DEMO_ORG_ID: !Ref DemoOrgId
          CLIENT_USERNAME: !Ref ClientUsername
          CLIENT_PASSWORD_HASH: !Ref ClientPasswordHash
          CLIENT_ORG_ID: !Ref ClientOrgId
      Events:
        Login:
          Type: Api
          Properties:
            RestApiId: !Ref JobsApi
            Path: /login
            Method: post
            Auth:
              Authorizer: NONE

  GetClientsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: clients.get_client.lambda_handler
      VpcConfig: &vpcConfig
        SecurityGroupIds:
          - !Ref VpcSecurityGroupId
        SubnetIds:
          - !Ref SubnetId1
          - !Ref SubnetId2
      Events:
        GetClients:
          Type: Api
          Properties:
            RestApiId: !Ref JobsApi
            Path: /clients
            Method: get

  CreateClientsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: clients.add_client.lambda_handler
      VpcConfig: *vpcConfig
      Events:
        CreateClient:
          Type: Api
          Properties:
            RestApiId: !Ref JobsApi
            Path: /clients
            Method: post

  UpdateClientsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: clients.update_client.lambda_handler
      VpcConfig: *vpcConfig
      Events:
        UpdateClient:
          Type: Api
          Properties:
            RestApiId: !Ref JobsApi
            Path: /clients/{id}
            Method: put

  DeleteClientsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: clients.delete_client.lambda_handler
      VpcConfig: *vpcConfig
      Events:
        DeleteClients:
          Type: Api
          Properties:
            RestApiId: !Ref JobsApi
            Path: /clients/{id}
            Method: delete

  GetJobsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: jobs.get_job.lambda_handler
      VpcConfig: *vpcConfig
      Events:
        GetJobs:
          Type: Api
          Properties:
            RestApiId: !Ref JobsApi
            Path: /jobs
            Method: get

  GetJobDatesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: jobs_dates.get_job_dates.lambda_handler
      VpcConfig: *vpcConfig
      Events:
        GetJobDates:
          Type: Api
          Properties:
            RestApiId: !Ref JobsApi
            Path: /job-dates
            Method: get

  CreateJobsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: jobs.add_job.lambda_handler
      VpcConfig: *vpcConfig
      Events:
        CreateJobs:
          Type: Api
          Properties:
            RestApiId: !Ref JobsApi
            Path: /jobs
            Method: post

  UpdateJobsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: jobs.update_job.lambda_handler
      VpcConfig: *vpcConfig
      Events:
        UpdateJobs:
          Type: Api
          Properties:
            RestApiId: !Ref JobsApi
            Path: /jobs/{id}
            Method: put

  DeleteJobsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: jobs.delete_job.lambda_handler
      VpcConfig: *vpcConfig
      Events:
        DeleteJobs:
          Type: Api
          Properties:
            RestApiId: !Ref JobsApi
            Path: /jobs/{id}
            Method: delete

  SyncJobsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: jobs.sync_jobs.lambda_handler
      Timeout: 30
      VpcConfig: *vpcConfig
      Events:
        SyncJobs:
          Type: Api
          Properties:
            RestApiId: !Ref JobsApi
            Path: /jobs/sync
            Method: post
        DailySync:
          Type: Schedule
          Properties:
            Schedule: cron(0 9 * * ? *)
            Enabled: true

  DeleteJobDatesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: jobs_dates.delete_job_dates.lambda_handler
      VpcConfig: *vpcConfig
      Events:
        GetJobDates:
          Type: Api
          Properties:
            RestApiId: !Ref JobsApi
            Path: /job-dates/{id}/{date}
            Method: delete

  UpdateJobDatesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: jobs_dates.update_job_dates.lambda_handler
      VpcConfig: *vpcConfig
      Events:
        GetJobDates:
          Type: Api
          Properties:
            RestApiId: !Ref JobsApi
            Path: /job-dates/{id}/{date}
            Method: put

  GetScheduleUnassignedFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: schedule.get_unassigned.lambda_handler
      VpcConfig: *vpcConfig
      Events:
        GetScheduleUnassigned:
          Type: Api
          Properties:
            RestApiId: !Ref JobsApi
            Path: /schedule/unassigned
            Method: get

  PreviewScheduleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: schedule.preview_schedule.lambda_handler
      Timeout: 30
      VpcConfig: *vpcConfig
      Events:
        PreviewSchedule:
          Type: Api
          Properties:
            RestApiId: !Ref JobsApi
            Path: /schedule/preview
            Method: post

  ApplyScheduleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: schedule.apply_schedule.lambda_handler
      Timeout: 30
      VpcConfig: *vpcConfig
      Events:
        ApplySchedule:
          Type: Api
          Properties:
            RestApiId: !Ref JobsApi
            Path: /schedule/apply
            Method: post

  GetOrganizationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: organizations.get_organization.lambda_handler
      VpcConfig: *vpcConfig
      Events:
        GetOrganization:
          Type: Api
          Properties:
            RestApiId: !Ref JobsApi
            Path: /organizations/{id}
            Method: get

  CreateOrganizationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: organizations.add_organization.lambda_handler
      VpcConfig: *vpcConfig
      Events:
        CreateOrganization:
          Type: Api
          Properties:
            RestApiId: !Ref JobsApi
            Path: /organizations
            Method: post

  UpdateOrganizationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: organizations.update_organization.lambda_handler
      VpcConfig: *vpcConfig
      Events:
        UpdateOrganization:
          Type: Api
          Properties:
            RestApiId: !Ref JobsApi
            Path: /organizations/{id}
            Method: put

# ============================================
# Outputs: printed after a successful deploy,
# so you have your live API URL immediately
# ============================================
Outputs:
  ApiUrl:
    Description: Base URL for the deployed API
    Value: !Sub "https://${JobsApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
